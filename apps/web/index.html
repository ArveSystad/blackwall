<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>blackwall</title>
    <meta name="theme-color" content="#0a0918" />
    <script>
      // Apply the stored theme, or else the device preference, before first paint. Dark is the
      // fallback (see src/theme.ts).
      try {
        var t = localStorage.getItem("blackwall.theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (t === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#f3f3f6");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
